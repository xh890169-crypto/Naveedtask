<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naveedtask</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    color:#222;
}
header{
    background:#1769aa;
    color:white;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}
.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}
.card{
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}
h2,h3{margin-top:0}
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}
button,.btn{
    border:0;
    border-radius:8px;
    padding:12px;
    background:#1769aa;
    color:white;
    font-size:15px;
    cursor:pointer;
    text-decoration:none;
    display:block;
    text-align:center;
}
.green{background:#168a45}
.orange{background:#e68a00}
.red{background:#d93025}
input{
    width:100%;
    padding:12px;
    margin:7px 0 12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}
.page{display:none}
.page.active{display:block}
.info{
    background:#eef6ff;
    border-radius:8px;
    padding:12px;
    margin:10px 0;
}
.payment{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin:12px 0;
}
.copy{
    background:#555;
    margin-top:8px;
}
nav{
