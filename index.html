<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naveedtask</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7f6;color:#174b4a;padding-bottom:75px}
button{font-family:inherit;cursor:pointer}

.header{
height:65px;background:#fff;display:flex;align-items:center;
justify-content:space-between;padding:0 18px;
box-shadow:0 2px 6px #0001;position:sticky;top:0;z-index:9
}
.logo{font-size:24px;font-weight:bold;color:#176d69}
.icons{font-size:22px}

.page{display:none}
.page.active{display:block}

.hero{
height:300px;position:relative;
background:url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80") center/cover
}
.hero:after{content:"";position:absolute;inset:0;background:#0005}
.heroText{position:absolute;z-index:2;color:white;left:25px;top:95px}
.heroText h1{font-size:30px;line-height:1.15}
.heroText p{margin-top:12px}
.stars{margin-top:15px;font-size:22px;color:#cbe995}

.title{font-size:24px;font-weight:bold;padding:20px}

.cards{
display:grid;grid-template-columns:repeat(2,1fr);
gap:10px;padding:0 16px
}

.card{
background:white;border:0;border-radius:10px;min-height:120px;
color:#176d69;font-size:34px;box-shadow:0 2px 7px #0001;padding:15px
}
